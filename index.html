<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Stock Hopper IP</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f5f9;
        }
        /* Custom border hitam tegas untuk input */
        .input-dark-border {
            border: 1.5px solid #1e293b !important;
        }
        .input-dark-border:focus {
            border-color: #059669 !important;
            ring: 2px;
        }
    </style>
</head>
<body class="min-h-screen pb-10">

    <!-- Header Navy / Dark Blue -->
    <header class="bg-[#0f172a] text-white px-4 py-4 shadow-md">
        <div class="max-w-3xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-[#059669] rounded-xl flex items-center justify-center text-white text-lg font-bold shadow-lg shadow-emerald-900/40">
                    <i class="fa-solid fa-industry"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base md:text-lg leading-tight">Laporan Stock Hopper IP</h1>
                    <p id="date-text" class="text-xs text-slate-400">Loading tanggal...</p>
                </div>
            </div>
            <button onclick="konfirmasiReset()" class="bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-xs font-medium px-3.5 py-2 rounded-lg border border-slate-700 flex items-center gap-1.5 transition">
                <i class="fa-solid fa-rotate-right"></i> Reset
            </button>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 mt-5 space-y-4">

        <!-- Card Informasi Operator & Shift -->
        <div class="bg-white rounded-2xl p-4 md:p-5 shadow-sm border-2 border-slate-900">
            <div class="flex items-center justify-between mb-4 border-b border-slate-200 pb-3">
                <div class="flex items-center gap-2 text-xs font-bold text-slate-700 uppercase tracking-wider">
                    <i class="fa-regular fa-id-card text-emerald-600"></i> INFORMASI OPERATOR & SHIFT
                </div>
                <span class="bg-emerald-50 text-emerald-700 text-[11px] font-semibold px-2.5 py-0.5 rounded-full flex items-center gap-1 border border-emerald-300">
                    <i class="fa-solid fa-circle-check"></i> Tersimpan
                </span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-800 mb-1.5">Shift Kerja</label>
                    <div class="relative">
                        <i class="fa-regular fa-clock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-600 text-sm"></i>
                        <input type="text" id="inp-shift" placeholder="..." oninput="simpanDataLokal()" 
                            class="w-full pl-10 pr-3.5 py-2.5 bg-white input-dark-border rounded-xl text-sm text-slate-900 placeholder-slate-400 font-medium outline-none transition">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-800 mb-1.5">Nama Operator / Pengisi</label>
                    <div class="relative">
                        <i class="fa-regular fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-600 text-sm"></i>
                        <input type="text" id="inp-nama" placeholder="..." oninput="simpanDataLokal()" 
                            class="w-full pl-10 pr-3.5 py-2.5 bg-white input-dark-border rounded-xl text-sm text-slate-900 placeholder-slate-400 font-medium outline-none transition">
                    </div>
                </div>
            </div>
        </div>

        <!-- Banner Total Hasil Stock -->
        <div class="bg-[#059669] text-white rounded-2xl p-4 shadow-lg shadow-emerald-700/20 flex items-center justify-between border-2 border-emerald-800">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white/10 backdrop-blur-md rounded-xl flex items-center justify-center text-white text-lg">
                    <i class="fa-solid fa-boxes-stacked"></i>
                </div>
                <div>
                    <p class="text-xs text-emerald-100 font-medium">Total Hasil Stock Hopper</p>
                    <p class="text-2xl font-bold tracking-tight"><span id="total-qty-val">0</span> <span class="text-xs font-normal text-emerald-200">Kg</span></p>
                </div>
            </div>
            <div id="count-mesin" class="bg-white/20 text-white text-xs font-medium px-3 py-1.5 rounded-lg border border-white/20">
                0 Mesin Input
            </div>
        </div>

        <!-- Section Rincian Data Mesin -->
        <div class="space-y-3">
            <div class="flex items-center justify-between px-1">
                <h2 class="text-sm font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-gears text-emerald-600"></i> Rincian Data Mesin
                </h2>
                <span class="text-xs text-slate-500 font-medium">Isi data tiap mesin</span>
            </div>

            <div id="containerMesin" class="space-y-4">
                <!-- Card Mesin dimasukkan via JS -->
            </div>
        </div>

        <!-- Tombol Tambah Mesin -->
        <button type="button" onclick="tambahBaris()" class="w-full py-3.5 bg-white hover:bg-slate-50 text-slate-800 font-bold text-sm rounded-xl border-2 border-slate-900 shadow-sm transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-circle-plus text-emerald-600 text-lg"></i> Tambah Mesin Lain
        </button>

        <!-- Tombol Kirim WhatsApp -->
        <button type="button" onclick="kirimWhatsApp()" class="w-full py-4 bg-[#059669] hover:bg-[#047857] active:bg-[#065f46] text-white font-bold text-base rounded-2xl shadow-lg shadow-emerald-700/30 transition flex items-center justify-center gap-2.5 border-2 border-emerald-800">
            <i class="fa-brands fa-whatsapp text-2xl"></i> Kirim Semua Data ke WhatsApp
        </button>

    </main>

    <script>
        let dataMesin = [];

        function updateTanggal() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
            document.getElementById('date-text').innerText = now.toLocaleDateString('id-ID', options);
        }

        function inisialisasiData() {
            updateTanggal();
            const simpananShift = localStorage.getItem('laprod_shift_v12');
            const simpananNama = localStorage.getItem('laprod_nama_v12');
            const simpananMesin = localStorage.getItem('laprod_mesin_v12');

            if (simpananShift) document.getElementById('inp-shift').value = simpananShift;
            if (simpananNama) document.getElementById('inp-nama').value = simpananNama;

            if (simpananMesin) {
                try { dataMesin = JSON.parse(simpananMesin); } catch(e) { dataMesin = []; }
            }

            if (!dataMesin || dataMesin.length === 0) {
                dataMesin = [buatStrukturMesinBaru()];
            }

            renderTampilan();
        }

        function buatStrukturMesinBaru() {
            return {
                noMesin: '',
                isSameInjector: true,
                inj1: { model: '', warna: '', qty: '' },
                inj2: { model: '', warna: '', qty: '' }
            };
        }

        function renderTampilan() {
            const container = document.getElementById('containerMesin');
            container.innerHTML = '';

            dataMesin.forEach((item, index) => {
                const isSame = item.isSameInjector !== false;

                const card = document.createElement('div');
                card.className = "bg-white p-4 md:p-5 rounded-2xl border-2 border-slate-900 shadow-sm space-y-4";
                
                let inj2HTML = '';
                if (!isSame) {
                    inj2HTML = `
                    <div class="bg-slate-50 p-3 rounded-xl border-2 border-slate-300 space-y-2">
                        <span class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
                            <i class="fa-solid fa-circle text-[8px] text-emerald-600"></i> Injector 2 (B)
                        </span>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-2.5">
                            <div>
                                <label class="text-[11px] font-bold text-slate-700 block mb-1">Model</label>
                                <input type="text" value="${item.inj2.model || ''}" placeholder="..." oninput="updateInjector(${index}, 'inj2', 'model', this.value)" 
                                    class="w-full px-3 py-1.5 bg-white input-dark-border rounded-lg text-xs font-medium outline-none transition">
                            </div>
                            <div>
                                <label class="text-[11px] font-bold text-slate-700 block mb-1">Warna</label>
                                <input type="text" value="${item.inj2.warna || ''}" placeholder="..." oninput="updateInjector(${index}, 'inj2', 'warna', this.value)" 
                                    class="w-full px-3 py-1.5 bg-white input-dark-border rounded-lg text-xs font-medium outline-none transition">
                            </div>
                            <div>
                                <label class="text-[11px] font-bold text-slate-700 block mb-1">Qty (Kg)</label>
                                <input type="number" value="${item.inj2.qty || ''}" placeholder="..." oninput="updateInjector(${index}, 'inj2', 'qty', this.value)" 
                                    class="w-full px-3 py-1.5 bg-emerald-50/80 input-dark-border text-emerald-950 font-bold rounded-lg text-xs outline-none transition">
                            </div>
                        </div>
                    </div>`;
                }

                card.innerHTML = `
                    <div class="flex items-center justify-between pb-3 border-b-2 border-slate-200">
                        <div class="flex items-center gap-2 w-full max-w-xs">
                            <span class="w-6 h-6 bg-slate-900 text-white rounded-full text-xs font-bold flex items-center justify-center shrink-0">${index + 1}</span>
                            <span class="text-xs font-bold text-slate-900 shrink-0">No. Mesin:</span>
                            <input type="text" value="${item.noMesin || ''}" placeholder="..." oninput="updateMesin(${index}, 'noMesin', this.value)" 
                                class="w-full px-2.5 py-1 bg-white input-dark-border rounded-lg text-xs font-bold text-slate-900 outline-none transition">
                        </div>
                        ${dataMesin.length > 1 ? `
                            <button type="button" onclick="hapusBaris(${index})" class="text-rose-600 hover:text-rose-800 text-xs font-bold bg-rose-50 px-2.5 py-1 rounded-lg border border-rose-300 transition shrink-0">
                                <i class="fa-solid fa-trash-can"></i> Hapus
                            </button>
                        ` : ''}
                    </div>

                    <div class="bg-emerald-50 border-2 border-emerald-300 p-2.5 rounded-xl flex items-center justify-between">
                        <label class="text-xs font-bold text-emerald-950 flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" ${isSame ? 'checked' : ''} onchange="toggleSameInjector(${index}, this.checked)" class="w-4 h-4 accent-emerald-600 rounded">
                            <span>Injector A & B Sama (1 Model & Warna)</span>
                        </label>
                    </div>

                    <div class="bg-slate-50 p-3 rounded-xl border-2 border-slate-300 space-y-2">
                        <span class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
                            <i class="fa-solid fa-circle text-[8px] text-emerald-600"></i> ${isSame ? 'Injector A & B (Stock Gabungan)' : 'Injector 1 (A)'}
                        </span>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-2.5">
                            <div>
                                <label class="text-[11px] font-bold text-slate-700 block mb-1">Model</label>
                                <input type="text" value="${item.inj1.model || ''}" placeholder="..." oninput="updateInjector(${index}, 'inj1', 'model', this.value)" 
                                    class="w-full px-3 py-1.5 bg-white input-dark-border rounded-lg text-xs font-medium outline-none transition">
                            </div>
                            <div>
                                <label class="text-[11px] font-bold text-slate-700 block mb-1">Warna</label>
                                <input type="text" value="${item.inj1.warna || ''}" placeholder="..." oninput="updateInjector(${index}, 'inj1', 'warna', this.value)" 
                                    class="w-full px-3 py-1.5 bg-white input-dark-border rounded-lg text-xs font-medium outline-none transition">
                            </div>
                            <div>
                                <label class="text-[11px] font-bold text-slate-700 block mb-1">Total Qty Stock (Kg)</label>
                                <input type="number" value="${item.inj1.qty || ''}" placeholder="..." oninput="updateInjector(${index}, 'inj1', 'qty', this.value)" 
                                    class="w-full px-3 py-1.5 bg-emerald-50/80 input-dark-border text-emerald-950 font-bold rounded-lg text-xs outline-none transition">
                            </div>
                        </div>
                    </div>

                    ${inj2HTML}
                `;
                container.appendChild(card);
            });

            document.getElementById('count-mesin').innerText = `${dataMesin.length} Mesin Input`;
            hitungTotalQty();
        }

        function toggleSameInjector(index, isChecked) {
            dataMesin[index].isSameInjector = isChecked;
            renderTampilan();
            simpanDataLokal();
        }

        function updateMesin(index, field, value) {
            dataMesin[index][field] = value;
            simpanDataLokal();
        }

        function updateInjector(index, injKey, field, value) {
            dataMesin[index][injKey][field] = value;
            if (field === 'qty') hitungTotalQty();
            simpanDataLokal();
        }

        function hitungTotalQty() {
            let total = 0;
            dataMesin.forEach(item => {
                total += (parseFloat(item.inj1.qty) || 0);
                if (item.isSameInjector === false) {
                    total += (parseFloat(item.inj2.qty) || 0);
                }
            });
            document.getElementById('total-qty-val').innerText = total.toLocaleString('id-ID');
        }

        function tambahBaris() {
            dataMesin.push(buatStrukturMesinBaru());
            renderTampilan();
            simpanDataLokal();
        }

        function hapusBaris(index) {
            if (dataMesin.length <= 1) return;
            dataMesin.splice(index, 1);
            renderTampilan();
            simpanDataLokal();
        }

        function simpanDataLokal() {
            const shift = document.getElementById('inp-shift').value;
            const nama = document.getElementById('inp-nama').value;

            localStorage.setItem('laprod_shift_v12', shift);
            localStorage.setItem('laprod_nama_v12', nama);
            localStorage.setItem('laprod_mesin_v12', JSON.stringify(dataMesin));
        }

        function konfirmasiReset() {
            if (confirm("Reset semua isi form ini?")) {
                document.getElementById('inp-shift').value = '';
                document.getElementById('inp-nama').value = '';
                dataMesin = [buatStrukturMesinBaru()];
                localStorage.removeItem('laprod_shift_v12');
                localStorage.removeItem('laprod_nama_v12');
                localStorage.removeItem('laprod_mesin_v12');
                renderTampilan();
            }
        }

        function kirimWhatsApp() {
            const shift = document.getElementById('inp-shift').value.trim();
            const nama = document.getElementById('inp-nama').value.trim();

            if (!shift || !nama) {
                alert('Harap lengkapi Shift dan Nama Operator!');
                return;
            }

            const tgl = document.getElementById('date-text').innerText;
            
            let totalQty = 0;
            let adaIsi = false;
            let daftarWarning = [];

            // Objek untuk mengelompokkan mesin berdasarkan Line
            let lineGroups = {};

            dataMesin.forEach((item) => {
                const noMesinRaw = item.noMesin.trim();
                const numOnly = parseInt(noMesinRaw.replace(/\D/g, ''), 10);
                
                const isSame = item.isSameInjector !== false;

                const m1 = (item.inj1.model || '').trim();
                const w1 = (item.inj1.warna || '').trim();
                const q1 = parseFloat(item.inj1.qty) || 0;

                const m2 = (item.inj2.model || '').trim();
                const w2 = (item.inj2.warna || '').trim();
                const q2 = parseFloat(item.inj2.qty) || 0;

                const inj1Isi = m1 || w1 || q1 > 0;
                const inj2Isi = !isSame && (m2 || w2 || q2 > 0);

                if (inj1Isi || inj2Isi) {
                    adaIsi = true;

                    // Hitung Line berdasarkan Nomor Mesin Riil (Mesin 1-2 = Line 1, Mesin 25-26 = Line 13)
                    let lineNum = 999; // Default jika tanpa angka
                    if (!isNaN(numOnly) && numOnly > 0) {
                        lineNum = Math.ceil(numOnly / 2);
                    }

                    if (!lineGroups[lineNum]) {
                        lineGroups[lineNum] = [];
                    }

                    const displayMesin = noMesinRaw ? `Mesin ${noMesinRaw}` : 'Mesin -';

                    if (isSame) {
                        totalQty += q1;
                        if (q1 < 50) {
                            lineGroups[lineNum].push(`• ${displayMesin} | A & B | ${m1 || '-'} | ${w1 || '-'} | *${q1} kg* ⚠️ *(STOCK MINIM)*`);
                            daftarWarning.push(`${displayMesin} (A&B): ${q1} kg`);
                        } else {
                            lineGroups[lineNum].push(`• ${displayMesin} | A & B | ${m1 || '-'} | ${w1 || '-'} | ${q1} kg`);
                        }
                    } else {
                        totalQty += (q1 + q2);
                        if (inj1Isi) {
                            if (q1 < 50) {
                                lineGroups[lineNum].push(`• ${displayMesin} | A | ${m1 || '-'} | ${w1 || '-'} | *${q1} kg* ⚠️ *(STOCK MINIM)*`);
                                daftarWarning.push(`${displayMesin} (Inj A): ${q1} kg`);
                            } else {
                                lineGroups[lineNum].push(`• ${displayMesin} | A | ${m1 || '-'} | ${w1 || '-'} | ${q1} kg`);
                            }
                        }
                        if (inj2Isi) {
                            if (q2 < 50) {
                                lineGroups[lineNum].push(`• ${displayMesin} | B | ${m2 || '-'} | ${w2 || '-'} | *${q2} kg* ⚠️ *(STOCK MINIM)*`);
                                daftarWarning.push(`${displayMesin} (Inj B): ${q2} kg`);
                            } else {
                                lineGroups[lineNum].push(`• ${displayMesin} | B | ${m2 || '-'} | ${w2 || '-'} | ${q2} kg`);
                            }
                        }
                    }
                }
            });

            if (!adaIsi) {
                alert('Isi minimal satu data mesin!');
                return;
            }

            let pesan = `*LAPORAN STOCK HOPPER IP*\n`;
            pesan += `📅 *Tanggal:* ${tgl}\n`;
            pesan += `⏰ *Shift:* ${shift}\n`;
            pesan += `👤 *Operator:* ${nama}\n`;
            pesan += `-----------------------------------\n\n`;

            // Urutkan Line dari terkecil ke terbesar
            const sortedLines = Object.keys(lineGroups).sort((a, b) => parseInt(a) - parseInt(b));

            sortedLines.forEach((line) => {
                if (line === "999") {
                    pesan += `🏭 *--- LAIN-LAIN ---*\n`;
                } else {
                    pesan += `🏭 *--- LINE ${line} ---*\n`;
                }

                lineGroups[line].forEach(barisText => {
                    pesan += `${barisText}\n`;
                });
                pesan += `\n`;
            });

            pesan += `-----------------------------------\n`;
            pesan += `📊 *TOTAL STOCK:* *${totalQty.toLocaleString('id-ID')} Kg*\n`;
            
            if (daftarWarning.length > 0) {
                pesan += `-----------------------------------\n`;
                pesan += `⚠️ *PERHATIAN: STOCK HOPPER KRITIS (<50Kg):*\n`;
                daftarWarning.forEach(w => {
                    pesan += `  • ${w}\n`;
                });
            }
            
            pesan += `-----------------------------------\n`;

            const urlWA = `https://wa.me/?text=${encodeURIComponent(pesan)}`;
            window.open(urlWA, '_blank');
        }

        window.onload = inisialisasiData;
    </script>
</body>
</html>
